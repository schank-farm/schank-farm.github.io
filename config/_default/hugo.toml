baseURL = "/"
title = "Schank Farm"
locale = "en"
summaryLength = 30
disableHugoGeneratorInject = true

contentDir = "src"
layoutDir = "page_layouts"
publishDir = "docs"
[[module.mounts]]
source = "src"
target = "content"

[[module.mounts]]
source = "page_layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "archetypes"
target = "archetypes"

[taxonomies]
  category = "categories"

[permalinks]
  posts = "/:slug/"

[params]
  version = "18"
  description = "take a ride in a combine if it's not pasture bedtime"
  subtitle = "take a ride in a combine if it's not pasture bedtime"

[outputs]
  home = ["HTML", "JSON"]


