[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peachy-keen-green-tools"
version = "0.1.0"
description = "Blogger Takeout feed converter and static site build tools for Hugo"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Peachy Keen Green" }
]
keywords = ["blogger", "hugo", "static-site-generator", "atom-feed", "takeout", "recipe-blog"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py"]
