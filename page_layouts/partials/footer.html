      <div class="article-footer-image" style="margin-bottom: 1.75rem;">

      </div>
    {{ end }}
    <p style="margin-bottom: 0.5rem;">Copyright 2013-2022, Patricia Schank</p>
    <p style="margin-bottom: 0.5rem;">Want a notification of new posts? Subscribe through <a href="https://feedly.com/" target="_blank" rel="noopener">feedly.com</a></p>
    <p style="margin-bottom: 0;">See also the <a href="https://peachykeengreen.github.io/" target="_blank" rel="noopener">Recipe Blog</a></p>
  </div>
</footer>
